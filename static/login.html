<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d1a">
  <meta name="referrer" content="no-referrer">
  <title>DAS Lab · 로그인</title>
  <link rel="stylesheet" href="/office.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">DAS LAB / AI OFFICE</p>
    <h1>내 팀과 이어지는 곳.</h1>
    <p id="login-help">먼저 내 PC에서 AI 오피스를 열고 <strong>휴대폰 연결</strong>을 누르세요. 휴대폰 카메라로 화면의 QR 코드를 스캔하면 연결됩니다.</p>
    <p id="login-progress" class="notice" role="status" aria-live="polite" hidden>휴대폰을 연결하고 있습니다…</p>
    <p id="login-error" class="notice error" role="alert" hidden>연결하지 못했습니다. PC에서 새 QR 코드를 만든 뒤 다시 스캔해 주세요.</p>
    <p class="small muted">연결 코드는 10분 동안 한 번만 쓸 수 있습니다. 연결한 뒤에는 이 휴대폰에서 말이나 글로 지시할 수 있습니다.</p>
    <noscript><p class="notice error">휴대폰 연결에는 브라우저의 JavaScript가 필요합니다.</p></noscript>
  </main>
</body>
</html>
